[project]
name = "foefie"
version = "0.1.0"
description = "Task runner for the ~/code workspace"
requires-python = ">=3.10"
dependencies = ["typer>=0.12"]

[project.urls]
Repository = "https://github.com/rijnhardtkotze/foefie"

[project.scripts]
foefie = "foefie.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foefie"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
